<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacto con la empresa ForzaSport.">
    <title>ForzaSport - Contacto</title>
    <link rel="shortcut icon" href="./Assets/image/logo FS.svg" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Assets/style/forzasport.css">
</head>
<body>

     <nav class="navbar navbar-expand-lg" style="background-color:  #8f8f8f;">
        <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand" href="index.html">
            <img src="./Assets/image/logo FS.svg" alt="ForzaSport" width="90">
        </a>

        <!-- Botón para celular -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú -->
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="tienda.html">
                        Tienda
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="contacto.html">
                        Contacto
                    </a>
                </li>  

                <li class="nav-item">
                    <a class="nav-link text-white" href="nosotros.html">
                        Nosotros
                    </a>
                </li>  
            </ul>

        </div>
    </nav>
    <main class="container my-4">
        <h1>Formulario de Contacto</h1>

        <div class="row">
            <!-- Formulario Validador -->
            <div class="col-md-6">
                <form class="p-3 bg-white border rounded">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="tel" class="form-label">Teléfono:</label>
                        <input type="tel" id="tel" name="tel" class="form-control" placeholder="123456789" required>
                    </div>

                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" class="form-control" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Enviar</button>
                </form>
            </div>

            <!-- Datos de contacto -->
            <div class="col-md-6 mt-4 mt-md-0">
                <div class="p-3 bg-dark text-white rounded">
                    <h3>Atención al Cliente</h3>
                    <p>📍 Dirección: Av. Principal 123</p>
                    <p>📞 Teléfono: +54 9 1234 5678</p>
                    <p>✉️ Correo: contacto@forzasport.com</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 ForzaSport - Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
